<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentación API - SuperEconómico</title>
  <style> body { margin: 0; } </style>
</head>
<body>

<script
  id="api-reference"
  data-configuration='{ "theme": "purple" }'>
</script>

<script>
  // Insertamos el contenido completo del YAML como objeto para asegurar compatibilidad total sin archivos externos
  const spec = {
  "openapi": "3.0.3",
  "info": {
    "title": "SuperEconomico API Cliente",
    "version": "1.3.0",
    "description": "Endpoints actualizados para la app cliente incluyendo Catálogo, Pedidos, Búsqueda, Métodos de Pago y Seguridad."
  },
  "servers": [
    { "url": "https://mvrlcbcydpubhovvrmvf.supabase.co", "description": "Supabase Producción" }
  ],
  "security": [
    { "ApiKeyAuth": [] },
    { "BearerAuth": [] }
  ],
  "components": {
    "securitySchemes": {
      "ApiKeyAuth": { "type": "apiKey", "in": "header", "name": "apikey" },
      "BearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" }
    },
    "schemas": {
      "RegistroRequest": {
        "type": "object",
        "required": ["email", "password", "data"],
        "properties": {
          "email": { "type": "string", "example": "edyahn@hotmail.com" },
          "password": { "type": "string", "example": "123456" },
          "data": {
            "type": "object",
            "properties": {
              "nombre_completo": { "type": "string" },
              "telefono": { "type": "string" },
              "direcciones": { "type": "array", "items": { "$ref": "#/components/schemas/Direccion" } }
            }
          }
        }
      },
      "AuthResponse": {
        "type": "object",
        "properties": {
          "access_token": { "type": "string" },
          "user": {
            "type": "object",
            "properties": {
              "id": { "type": "string", "format": "uuid" },
              "email": { "type": "string" }
            }
          }
        }
      },
      "Categoria": {
        "type": "object",
        "properties": {
          "id": { "type": "integer" },
          "nombre": { "type": "string" },
          "imagen_url": { "type": "string" }
        }
      },
      "Producto": {
        "type": "object",
        "properties": {
          "id": { "type": "integer" },
          "categoria_id": { "type": "integer" },
          "nombre": { "type": "string" },
          "descripcion": { "type": "string" },
          "precio": { "type": "number" },
          "imagen_url": { "type": "string" },
          "esta_activo": { "type": "boolean" }
        }
      },
      "Pedido": {
        "type": "object",
        "properties": {
          "id": { "type": "integer" },
          "perfil_id": { "type": "string", "format": "uuid" },
          "estado": { "type": "string", "enum": ["pendiente", "cocina", "entrega", "cerrado"] },
          "total": { "type": "number" },
          "direccion_id": { "type": "integer" },
          "metodo_pago": { "type": "string", "enum": ["Efectivo", "Tarjeta"] },
          "creado_at": { "type": "string", "format": "date-time" }
        }
      },
      "PedidoItem": {
        "type": "object",
        "properties": {
          "id": { "type": "integer" },
          "pedido_id": { "type": "integer" },
          "producto_id": { "type": "integer" },
          "cantidad": { "type": "integer" },
          "precio_unitario": { "type": "number" }
        }
      },
      "Perfil": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "email": { "type": "string" },
          "nombre_completo": { "type": "string" },
          "telefono": { "type": "string" },
          "descripcion": { "type": "string" },
          "rol": { "type": "string", "enum": ["cliente", "encargado"] }
        }
      },
      "Direccion": {
        "type": "object",
        "properties": {
          "id": { "type": "integer" },
          "perfil_id": { "type": "string", "format": "uuid" },
          "etiqueta": { "type": "string" },
          "direccion_texto": { "type": "string" },
          "latitud": { "type": "number" },
          "longitud": { "type": "number" }
        }
      },
      "LogErrorRequest": {
        "type": "object",
        "properties": {
          "clase_origen": { "type": "string" },
          "metodo": { "type": "string" },
          "mensaje_error": { "type": "string" },
          "stack_trace": { "type": "string" },
          "usuario_id": { "type": "string" }
        }
      }
    }
  },
  "paths": {
    "/auth/v1/signup": {
      "post": {
        "summary": "Registro de cliente",
        "tags": ["Autenticación"],
        "requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RegistroRequest" } } } },
        "responses": { "200": { "description": "Éxito" } }
      }
    },
    "/auth/v1/token": {
      "post": {
        "summary": "Login (Email/Teléfono + Contraseña)",
        "tags": ["Autenticación"],
        "parameters": [{ "in": "query", "name": "grant_type", "schema": { "type": "string", "default": "password" } }],
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "email": { "type": "string" }, "password": { "type": "string" } } } } } },
        "responses": { "200": { "description": "Login exitoso", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AuthResponse" } } } } }
      }
    },
    "/auth/v1/user": {
      "put": {
        "summary": "Actualizar contraseña (Seguridad)",
        "tags": ["Autenticación"],
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "password": { "type": "string" } } } } } },
        "responses": { "200": { "description": "Actualizada" } }
      }
    },
    "/rest/v1/perfiles": {
      "get": {
        "summary": "Buscar perfil (Soporte Login Dual)",
        "tags": ["Perfiles"],
        "parameters": [
          { "in": "query", "name": "telefono", "schema": { "type": "string", "example": "eq.95212400" } },
          { "in": "query", "name": "select", "schema": { "type": "string", "default": "email" } }
        ],
        "responses": { "200": { "description": "Perfil encontrado" } }
      },
      "patch": {
        "summary": "Actualizar datos personales",
        "tags": ["Perfiles"],
        "parameters": [{ "in": "query", "name": "id", "schema": { "type": "string", "example": "eq.uuid" } }],
        "requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Perfil" } } } },
        "responses": { "204": { "description": "Actualizado" } }
      }
    },
    "/rest/v1/categorias": {
      "get": {
        "summary": "Listar categorías del catálogo",
        "tags": ["Catálogo"],
        "responses": { "200": { "description": "Lista de categorías" } }
      }
    },
    "/rest/v1/productos": {
      "get": {
        "summary": "Listar productos (Búsqueda y Filtros)",
        "tags": ["Catálogo"],
        "parameters": [
          { "in": "query", "name": "nombre", "description": "Filtro de búsqueda por nombre (ilike)", "schema": { "type": "string", "example": "ilike.*corona*" } },
          { "in": "query", "name": "categoria_id", "schema": { "type": "string", "example": "eq.1" } }
        ],
        "responses": { "200": { "description": "Lista de productos" } }
      }
    },
    "/rest/v1/pedidos": {
      "get": {
        "summary": "Historial de pedidos del cliente",
        "tags": ["Pedidos"],
        "parameters": [{ "in": "query", "name": "perfil_id", "schema": { "type": "string", "example": "eq.uuid" } }],
        "responses": { "200": { "description": "Lista de pedidos" } }
      },
      "post": {
        "summary": "Crear pedido (Checkout)",
        "tags": ["Pedidos"],
        "parameters": [{ "in": "header", "name": "Prefer", "schema": { "type": "string", "default": "return=representation" } }],
        "requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Pedido" } } } },
        "responses": { "201": { "description": "Pedido creado" } }
      },
      "delete": {
        "summary": "Eliminar pedido completo",
        "tags": ["Pedidos"],
        "parameters": [{ "in": "query", "name": "id", "schema": { "type": "string", "example": "eq.1" } }],
        "responses": { "204": { "description": "Eliminado" } }
      }
    },
    "/rest/v1/pedido_items": {
      "get": {
        "summary": "Ver detalles de productos en un pedido",
        "tags": ["Pedidos"],
        "parameters": [{ "in": "query", "name": "pedido_id", "schema": { "type": "string", "example": "eq.1" } }],
        "responses": { "200": { "description": "Items del pedido" } }
      },
      "post": {
        "summary": "Insertar productos al pedido",
        "tags": ["Pedidos"],
        "requestBody": { "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/PedidoItem" } } } } },
        "responses": { "201": { "description": "Insertados" } }
      },
      "patch": {
        "summary": "Modificar cantidad de un producto (Sumar/Restar)",
        "tags": ["Pedidos"],
        "parameters": [{ "in": "query", "name": "id", "schema": { "type": "string", "example": "eq.1" } }],
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "cantidad": { "type": "integer" } } } } } },
        "responses": { "204": { "description": "Cantidad actualizada" } }
      },
      "delete": {
        "summary": "Quitar producto del pedido",
        "tags": ["Pedidos"],
        "parameters": [{ "in": "query", "name": "id", "schema": { "type": "string", "example": "eq.1" } }],
        "responses": { "204": { "description": "Item eliminado" } }
      }
    },
    "/rest/v1/direcciones": {
      "get": {
        "summary": "Listar mis direcciones de entrega",
        "tags": ["Direcciones"],
        "parameters": [{ "in": "query", "name": "perfil_id", "schema": { "type": "string", "example": "eq.uuid" } }],
        "responses": { "200": { "description": "Lista de direcciones" } }
      },
      "post": {
        "summary": "Guardar nueva ubicación con coordenadas GPS",
        "tags": ["Direcciones"],
        "requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Direccion" } } } },
        "responses": { "201": { "description": "Dirección guardada" } }
      },
      "delete": {
        "summary": "Eliminar dirección",
        "tags": ["Direcciones"],
        "parameters": [{ "in": "query", "name": "id", "schema": { "type": "string", "example": "eq.1" } }],
        "responses": { "204": { "description": "Eliminada" } }
      }
    },
    "/rest/v1/logs_errores": {
      "post": {
        "summary": "Reportar errores de la App (Remote Logger)",
        "tags": ["Soporte"],
        "requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LogErrorRequest" } } } },
        "responses": { "201": { "description": "Error registrado" } }
      }
    }
  }
};

  document.getElementById('api-reference').dataset.spec = JSON.stringify(spec);
</script>

<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

</body>
</html>
