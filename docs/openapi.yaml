openapi: 3.0.3
info:
  title: SuperEconomico API Cliente
  version: 1.4.0
  description: Endpoints actualizados para la app cliente incluyendo Autenticación, Catálogo, Pedidos, Métodos de Pago, Direcciones y Soporte.

servers:
  - url: https://mvrlcbcydpubhovvrmvf.supabase.co
    description: Supabase Producción

security:
  - ApiKeyAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegistroRequest:
      type: object
      required: [email, password, data]
      properties:
        email: {type: string, example: edyahn@hotmail.com}
        password: {type: string, example: "123456"}
        data:
          type: object
          properties:
            nombre_completo: {type: string}
            telefono: {type: string}
            direcciones:
              type: array
              items:
                $ref: "#/components/schemas/Direccion"

    AuthResponse:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer}
        user:
          type: object
          properties:
            id: {type: string, format: uuid}
            email: {type: string}
        profile:
          $ref: "#/components/schemas/Perfil"
        rol: {type: string, enum: [cliente, repartidor, encargado]}

    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: {type: string, format: uuid}
            email: {type: string}
        profile:
          $ref: "#/components/schemas/Perfil"
        rol: {type: string, enum: [cliente, repartidor, encargado]}

    VerifyOtpRequest:
      type: object
      properties:
        email: {type: string}
        token: {type: string}
        type: {type: string, enum: [signup, recovery]}

    RecoverRequest:
      type: object
      properties:
        email: {type: string}

    PhoneLoginRequest:
      type: object
      properties:
        phone: {type: string, example: "99999999"}
        password: {type: string}
        origin: {type: string, enum: [app_cliente, cpanel], example: app_cliente}

    LogoutRequest:
      type: object
      properties:
        origin: {type: string, enum: [app_cliente, cpanel], example: app_cliente}

    CrearPedidoSeguroRequest:
      type: object
      required: [p_metodo_pago, p_items]
      properties:
        p_direccion_id: {type: integer, nullable: true}
        p_metodo_pago: {type: string, example: "Efectivo"}
        p_items:
          type: array
          items:
            type: object
            required: [producto_id, cantidad]
            properties:
              producto_id: {type: integer}
              cantidad: {type: integer}

    PedidosActivosRepartidorRequest:
      type: object
      required: [p_repartidor_id]
      properties:
        p_repartidor_id: {type: string, format: uuid}

    AdminUsersRequest:
      type: object
      properties:
        action: {type: string, enum: [list, create, update, delete]}
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        password: {type: string}
        role: {type: string, enum: [cliente, repartidor, encargado]}

    Categoria:
      type: object
      properties:
        id: {type: integer}
        nombre: {type: string}
        imagen_url: {type: string}

    Producto:
      type: object
      properties:
        id: {type: integer}
        categoria_id: {type: integer}
        nombre: {type: string}
        descripcion: {type: string}
        precio: {type: number}
        imagen_url: {type: string}
        esta_activo: {type: boolean}

    Pedido:
      type: object
      properties:
        id: {type: integer}
        perfil_id: {type: string, format: uuid}
        estado: {type: string, enum: [pendiente, preparando, en_camino, entregado, cancelado]}
        total: {type: number}
        direccion_id: {type: integer}
        metodo_pago: {type: string}
        creado_at: {type: string, format: date-time}

    PedidoItem:
      type: object
      properties:
        id: {type: integer}
        pedido_id: {type: integer}
        producto_id: {type: integer}
        cantidad: {type: integer}
        precio_unitario: {type: number}
        nombre: {type: string}
        imagen_url: {type: string}

    Perfil:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        nombre_completo: {type: string}
        telefono: {type: string}
        direccion: {type: string}
        descripcion: {type: string}
        avatar_url: {type: string}
        rol: {type: string, enum: [cliente, repartidor, encargado]}

    Direccion:
      type: object
      properties:
        id: {type: integer}
        perfil_id: {type: string, format: uuid}
        etiqueta: {type: string}
        direccion_texto: {type: string}
        latitud: {type: number}
        longitud: {type: number}

    MetodoPago:
      type: object
      properties:
        id: {type: integer}
        perfil_id: {type: string, format: uuid}
        titular: {type: string}
        numero_tarjeta: {type: string}
        fecha_expiracion: {type: string}

    LoginAcceptanceRequest:
      type: object
      properties:
        usuario_id: {type: string, format: uuid}
        email: {type: string}

    LogErrorRequest:
      type: object
      properties:
        clase_origen: {type: string}
        metodo: {type: string}
        mensaje_error: {type: string}
        stack_trace: {type: string}
        usuario_id: {type: string}

    AccessLog:
      type: object
      properties:
        id: {type: integer}
        usuario_id: {type: string, format: uuid}
        email: {type: string}
        rol: {type: string, enum: [cliente, repartidor, encargado]}
        origen: {type: string, example: app_cliente}
        evento: {type: string, enum: [login, logout]}
        user_agent: {type: string}
        created_at: {type: string, format: date-time}

paths:
  /auth/v1/signup:
    post:
      summary: Registro de cliente
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistroRequest"}
      responses:
        "200": {description: Éxito}

  /functions/v1/login:
    post:
      summary: Login por correo y contrasena
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                password: {type: string}
                origin: {type: string, enum: [app_cliente, cpanel], example: app_cliente}
      responses:
        "200":
          description: Login exitoso con perfil y rol
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResponse"}
              example:
                access_token: "string"
                refresh_token: "string"
                expires_in: 3600
                user:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  email: "cliente@correo.com"
                profile:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  email: "cliente@correo.com"
                  nombre_completo: "Cliente Ejemplo"
                  telefono: "99999999"
                  rol: "cliente"
                rol: "cliente"

  /functions/v1/login-by-phone:
    post:
      summary: Login por teléfono y contraseña
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneLoginRequest"}
      responses:
        "200":
          description: Login exitoso con perfil y rol
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResponse"}
              example:
                access_token: "string"
                refresh_token: "string"
                expires_in: 3600
                user:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  email: "cliente@correo.com"
                profile:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  email: "cliente@correo.com"
                  nombre_completo: "Cliente Ejemplo"
                  telefono: "99999999"
                  rol: "cliente"
                rol: "cliente"

  /functions/v1/me:
    get:
      summary: Perfil de sesion autenticada
      description: Devuelve el usuario autenticado, su perfil y rol para decidir si puede entrar a la app cliente, app repartidor o cPanel.
      tags: [Autenticacion]
      responses:
        "200":
          description: Perfil autenticado con rol
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MeResponse"}
        "401": {description: Sesion invalida}
        "404": {description: Perfil no encontrado}

  /auth/v1/verify:
    post:
      summary: Verificar OTP para Registro o Recuperación
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyOtpRequest"}
      responses:
        "200": {description: Verificado correctamente}

  /auth/v1/recover:
    post:
      summary: Solicitar recuperación de contraseña
      tags: [Autenticacion]
      parameters:
        - in: query
          name: redirect_to
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoverRequest"}
      responses:
        "200": {description: Correo de recuperación enviado}

  /auth/v1/user:
    put:
      summary: Actualizar datos de usuario (Contraseña)
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string}
      responses:
        "200": {description: Actualizada}

  /functions/v1/logout:
    post:
      summary: Cerrar sesion y registrar salida
      description: Cierra la sesion autenticada y registra el evento logout en logs_accesos desde el backend.
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LogoutRequest"}
      responses:
        "200": {description: Sesion cerrada y acceso registrado}

  /functions/v1/process-auth:
    post:
      summary: Procesar flujo auxiliar de autenticación
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Flujo procesado}

  /functions/v1/process-signup:
    post:
      summary: Procesar registro auxiliar
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Registro procesado}

  /rest/v1/aceptaciones_login:
    post:
      summary: Registrar aceptación de login para auditoría
      tags: [Autenticacion]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginAcceptanceRequest"}
      responses:
        "201": {description: Aceptación registrada}

  /rest/v1/perfiles:
    get:
      summary: Obtener perfiles por ID o Teléfono
      tags: [Perfiles]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.uuid"}
        - in: query
          name: telefono
          schema: {type: string, example: "eq.95212400"}
        - in: query
          name: select
          schema: {type: string, default: "*"}
      responses:
        "200": {description: Perfil encontrado}
    patch:
      summary: Actualizar datos del perfil
      tags: [Perfiles]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.uuid"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Perfil"}
      responses:
        "204": {description: Actualizado}

  /rest/v1/categorias:
    get:
      summary: Listar categorías del catálogo
      tags: [Catalogo]
      parameters:
        - in: query
          name: select
          schema: {type: string, default: "*"}
      responses:
        "200": {description: Lista de categorías}

    post:
      summary: Crear categoria
      tags: [Catalogo]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Categoria"}
      responses:
        "201": {description: Categoria creada}
    patch:
      summary: Actualizar categoria
      tags: [Catalogo]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Categoria"}
      responses:
        "204": {description: Categoria actualizada}
    delete:
      summary: Eliminar categoria
      tags: [Catalogo]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      responses:
        "204": {description: Categoria eliminada}

  /rest/v1/productos:
    get:
      summary: Listar productos (Búsqueda y Filtros)
      tags: [Catalogo]
      parameters:
        - in: query
          name: select
          schema: {type: string, default: "*"}
        - in: query
          name: esta_activo
          schema: {type: string, example: "eq.true"}
        - in: query
          name: categoria_id
          schema: {type: string, example: "eq.1"}
      responses:
        "200": {description: Lista de productos}

    post:
      summary: Crear producto
      tags: [Catalogo]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Producto"}
      responses:
        "201": {description: Producto creado}
    patch:
      summary: Actualizar producto
      tags: [Catalogo]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Producto"}
      responses:
        "204": {description: Producto actualizado}
    delete:
      summary: Eliminar producto
      tags: [Catalogo]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      responses:
        "204": {description: Producto eliminado}

  /rest/v1/pedidos:
    get:
      summary: Historial de pedidos del cliente
      tags: [Pedidos]
      parameters:
        - in: query
          name: perfil_id
          schema: {type: string, example: "eq.uuid"}
        - in: query
          name: id
          schema: {type: string, example: "eq.123"}
        - in: query
          name: repartidor_id
          schema: {type: string, example: "eq.uuid-repartidor"}
        - in: query
          name: estado
          schema: {type: string, example: "not.in.(entregado,cancelado)"}
        - in: query
          name: select
          schema: {type: string, default: "*"}
        - in: query
          name: order
          schema: {type: string, example: "creado_at.desc"}
      responses:
        "200": {description: Lista de pedidos}
    post:
      summary: Crear pedido (Checkout)
      tags: [Pedidos]
      parameters:
        - in: header
          name: Prefer
          schema: {type: string, default: "return=representation"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Pedido"}
      responses:
        "201": {description: Pedido creado}
    patch:
      summary: Actualizar estado o repartidor del pedido
      tags: [Pedidos]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: {type: string}
                repartidor_id: {type: string, format: uuid, nullable: true}
      responses:
        "204": {description: Pedido actualizado}
    delete:
      summary: Eliminar pedido completo
      tags: [Pedidos]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      responses:
        "204": {description: Eliminado}

  /rest/v1/pedido_items:
    get:
      summary: Ver detalles de productos en un pedido
      tags: [Pedidos]
      parameters:
        - in: query
          name: pedido_id
          schema: {type: string, example: "eq.1"}
        - in: query
          name: select
          schema: {type: string, default: "*"}
      responses:
        "200": {description: Items del pedido}
    post:
      summary: Insertar productos al pedido
      tags: [Pedidos]
      requestBody:
        content:
          application/json:
            schema: {type: array, items: {$ref: "#/components/schemas/PedidoItem"}}
      responses:
        "201": {description: Insertados}
    patch:
      summary: Modificar item del pedido
      tags: [Pedidos]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {cantidad: {type: integer}}}
      responses:
        "204": {description: Item actualizado}
    delete:
      summary: Quitar producto del pedido
      tags: [Pedidos]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      responses:
        "204": {description: Item eliminado}

  /rest/v1/rpc/crear_pedido_seguro:
    post:
      summary: Crear pedido seguro desde carrito
      tags: [Pedidos]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrearPedidoSeguroRequest"}
      responses:
        "200": {description: ID del pedido creado}

  /rest/v1/rpc/pedidos_activos_por_repartidor:
    post:
      summary: Pedidos activos asignados a un repartidor
      description: Devuelve los pedidos del repartidor indicado cuyo estado no sea entregado ni cancelado.
      tags: [Pedidos]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PedidosActivosRepartidorRequest"}
            example:
              p_repartidor_id: "00000000-0000-0000-0000-000000000000"
      responses:
        "200":
          description: Lista de pedidos pendientes, en preparacion o en camino asignados al repartidor
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Pedido"}

  /rest/v1/direcciones:
    get:
      summary: Listar mis direcciones de entrega
      tags: [Direcciones]
      parameters:
        - in: query
          name: perfil_id
          schema: {type: string, example: "eq.uuid"}
        - in: query
          name: select
          schema: {type: string, default: "*"}
      responses:
        "200": {description: Lista de direcciones}
    post:
      summary: Guardar nueva ubicación
      tags: [Direcciones]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Direccion"}
      responses:
        "201": {description: Dirección guardada}
    delete:
      summary: Eliminar dirección
      tags: [Direcciones]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      responses:
        "204": {description: Eliminada}

    patch:
      summary: Actualizar direccion
      tags: [Direcciones]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Direccion"}
      responses:
        "204": {description: Direccion actualizada}

  /rest/v1/metodos_pago:
    get:
      summary: Listar métodos de pago guardados
      tags: [Pagos]
      parameters:
        - in: query
          name: perfil_id
          schema: {type: string, example: "eq.uuid"}
        - in: query
          name: select
          schema: {type: string, default: "*"}
      responses:
        "200": {description: Lista de tarjetas}
    post:
      summary: Registrar nuevo método de pago
      tags: [Pagos]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetodoPago"}
      responses:
        "201": {description: Guardado}
    delete:
      summary: Eliminar tarjeta
      tags: [Pagos]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      responses:
        "204": {description: Eliminado}

    patch:
      summary: Actualizar metodo de pago
      tags: [Pagos]
      parameters:
        - in: query
          name: id
          schema: {type: string, example: "eq.1"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetodoPago"}
      responses:
        "204": {description: Metodo de pago actualizado}

  /rest/v1/logs_errores:
    get:
      summary: Listar errores registrados
      tags: [Soporte]
      parameters:
        - in: query
          name: order
          schema: {type: string, example: "created_at.desc"}
        - in: query
          name: limit
          schema: {type: integer, example: 50}
      responses:
        "200": {description: Lista de errores}
    post:
      summary: Reportar errores de la App
      tags: [Soporte]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LogErrorRequest"}
      responses:
        "201": {description: Error registrado}

  /rest/v1/logs_accesos:
    get:
      summary: Listar accesos de usuarios
      description: Disponible para usuarios con rol encargado en el cPanel.
      tags: [Soporte]
      parameters:
        - in: query
          name: order
          schema: {type: string, example: "created_at.desc"}
        - in: query
          name: limit
          schema: {type: integer, example: 100}
      responses:
        "200":
          description: Lista de ingresos y salidas
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AccessLog"}
  /functions/v1/admin-users:
    post:
      summary: Administrar usuarios desde cPanel
      tags: [Administracion]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminUsersRequest"}
      responses:
        "200": {description: Accion administrativa completada}
