<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Admin El Economico | Control de Inventario y Pedidos</title> <script src="https://cdn.tailwindcss.com"></script> <style> :root { --primary: #317832; --primary-dark: #246026; } .bg-primary { background-color: var(--primary); } .text-primary { color: var(--primary); } .top-nav { background: linear-gradient(90deg, var(--primary-dark), var(--primary)); border-bottom: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 24px rgba(15,23,42,.18); } .nav-shell { display: flex; align-items: center; justify-content: space-between; gap: 1rem; } .nav-tabs { display: flex; align-items: center; justify-content: flex-end; gap: .45rem; flex-wrap: wrap; } .nav-tab { min-width: 106px; height: 40px; padding: 0 1rem; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.1); color: rgba(255,255,255,.88); font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; transition: background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease; } .nav-tab:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); } .nav-tab.active { background: #fff; color: var(--primary-dark); border-color: #fff; box-shadow: 0 6px 14px rgba(15,23,42,.14); } .nav-tab.logout { min-width: 82px; color: #ffe5e5; border-color: rgba(255,255,255,.22); } .nav-tab.logout:hover { background: #fff; color: #b91c1c; } .loader { border: 3px solid #f3f3f3; border-top: 3px solid #317832; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; } @media (max-width: 820px) { .nav-shell { align-items: flex-start; flex-direction: column; } .nav-tabs { justify-content: flex-start; width: 100%; } .nav-tab { flex: 1 1 132px; } } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style> </head> <body class="bg-slate-50 min-h-screen font-sans text-slate-900">
<!-- NAVBAR -->
<nav class="top-nav text-white px-4 py-3 sticky top-0 z-50">
    <div class="container mx-auto nav-shell">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🛒</span>
            <h1 class="text-2xl font-black tracking-tight uppercase italic">El Economico <span class="font-light not-italic opacity-70 text-sm">Admin</span></h1>
        </div>
        <div class="nav-tabs">
            <button onclick="switchTab('orders')" class="nav-tab active" id="btn-orders">PEDIDOS</button>
            <button onclick="switchTab('cats')" class="nav-tab" id="btn-cats">CATEGORÍAS</button>
            <button onclick="switchTab('prods')" class="nav-tab" id="btn-prods">PRODUCTOS</button>
        </div>
    </div>
</nav>

<div class="container mx-auto p-8">
    <!-- MONITOR DE ESTADO -->
    <div id="status-card" class="mb-8 p-4 rounded-2xl text-center font-black text-xs uppercase tracking-widest bg-green-100 text-green-700 border border-green-200">
        Sincronización Directa Activa ✅
    </div>

    <!-- SECCIÓN PEDIDOS -->
    <section id="sec-orders" class="tab-content">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-black text-slate-800 tracking-tighter">Panel de Despacho</h2>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Flujo de entrega en tiempo real</p>
            </div>
            <div class="flex gap-2">
                <button onclick="createSimulatedOrder()" class="bg-blue-600 text-white px-5 py-2.5 rounded-2xl font-black text-[10px] uppercase shadow-lg hover:bg-blue-700 transition">Simular Pedido</button>
                <button onclick="loadData()" class="bg-primary text-white px-5 py-2.5 rounded-2xl font-black text-[10px] uppercase shadow-lg hover:brightness-110 transition">Refrescar</button>
            </div>
        </div>
        
        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-slate-200">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-400 uppercase text-[10px] font-black tracking-widest border-b border-slate-100">
                    <tr>
                        <th class="p-6">Orden</th>
                        <th class="p-6">Total</th>
                        <th class="p-6 text-center">Estado App</th>
                        <th class="p-6 text-center">Simular Ciclo</th>
                    </tr>
                </thead>
                <tbody id="table-orders" class="divide-y divide-slate-100"></tbody>
            </table>
            <div id="no-orders" class="hidden p-20 text-center text-slate-300 font-black uppercase tracking-widest text-xs">
                No hay órdenes en espera
            </div>
        </div>
    </section>

    <!-- SECCIÓN CATEGORÍAS (CUADRADAS) -->
    <section id="sec-cats" class="tab-content hidden">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black text-slate-800">Categorías</h2>
            <button onclick="openMod('modal-cat')" class="bg-primary text-white px-8 py-3 rounded-2xl font-bold shadow-lg hover:brightness-110 transition">+ Nueva</button>
        </div>
        <div id="grid-cats" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
    </section>

    <!-- SECCIÓN PRODUCTOS -->
    <section id="sec-prods" class="tab-content hidden">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black text-slate-800">Inventario</h2>
            <button onclick="openMod('modal-prod')" class="bg-primary text-white px-8 py-3 rounded-2xl font-bold shadow-lg hover:brightness-110 transition">+ Agregar</button>
        </div>
        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-400 uppercase text-[10px] font-black tracking-widest border-b">
                    <tr><th class="p-6">Foto</th><th class="p-6">Nombre</th><th class="p-6">Precio</th><th class="p-6 text-center">Acción</th></tr>
                </thead>
                <tbody id="table-prods" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </section>
</div>

<!-- MODAL CATEGORÍA -->
<div id="modal-cat" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-10 shadow-2xl">
        <h3 id="cat-title" class="text-2xl font-black mb-6 text-primary tracking-tighter">Categoría</h3>
        <form onsubmit="event.preventDefault(); saveCategory();" class="space-y-5">
            <input type="hidden" id="cat-id">
            <input type="text" id="cat-name" class="w-full border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-primary transition" placeholder="Nombre" required>
            <div><label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Imagen (PNG)</label><input type="file" id="cat-file" accept="image/*" class="w-full text-xs"></div>
            <div class="flex gap-3 pt-4"><button type="submit" class="flex-1 bg-primary text-white py-4 rounded-2xl font-bold shadow-lg">Guardar</button><button type="button" onclick="closeMod()" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Cerrar</button></div>
        </form>
    </div>
</div>

<!-- MODAL PRODUCTO -->
<div id="modal-prod" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-[2.5rem] w-full max-w-md p-10 shadow-2xl max-h-[90vh] overflow-y-auto">
        <h3 id="prod-title" class="text-2xl font-black mb-6 text-primary tracking-tighter text-center">Ficha de Producto</h3>
        <form onsubmit="event.preventDefault(); saveProduct();" class="space-y-4">
            <input type="hidden" id="prod-id">
            <input type="text" id="prod-name" class="w-full border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-primary" placeholder="Nombre" required>
            <textarea id="prod-desc" class="w-full border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-primary" rows="2" placeholder="Descripción"></textarea>
            <select id="prod-cat" class="w-full border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-primary" required></select>
            <input type="number" step="0.01" id="prod-price" class="w-full border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-primary" placeholder="Precio Base L." required>
            <div class="flex items-center gap-3 bg-orange-50 p-4 rounded-2xl border border-orange-100"><input type="checkbox" id="prod-is-offer" class="w-6 h-6 accent-orange-500"><label class="text-sm font-black text-orange-800 uppercase tracking-tighter">Oferta Activa</label></div>
            <input type="number" step="0.01" id="prod-price-offer" class="w-full border-2 border-orange-100 p-4 rounded-2xl outline-none focus:border-orange-500" placeholder="Precio Oferta">
            <input type="file" id="prod-file" accept="image/*" class="w-full text-xs">
            <div id="p-loader" class="hidden flex flex-col items-center gap-2 mb-4"><div class="loader"></div><span class="text-[10px] font-bold text-blue-600 uppercase">Sincronizando...</span></div>
            <div class="flex gap-3 pt-4"><button type="submit" id="p-save-btn" class="flex-1 bg-primary text-white py-4 rounded-2xl font-bold shadow-lg">Publicar</button><button type="button" onclick="closeMod()" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Cerrar</button></div>
        </form>
    </div>
</div>

<script>
    const API_URL = "https://mvrlcbcydpubhovvrmvf.supabase.co/rest/v1";
    const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12cmxjYmN5ZHB1YmhvdnZybXZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDA3OTAsImV4cCI6MjA5ODMxNjc5MH0.rNQq1xOA5zGJpMiHlhsXKw5lWLg49qYUtDSC9M7Iha8";
    const h = { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json", "Prefer": "return=representation" };

    const req = (path, method = 'GET', body = null) => fetch(`${API_URL}/${path}`, { method, headers: h, body: body ? JSON.stringify(body) : null }).then(r => r.json());

    const compress = f => new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(f);
        reader.onload = (e) => {
            const img = new Image(); img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas'); const MAX = 500;
                let w = img.width, h = img.height;
                if (w > MAX) { h *= MAX/w; w = MAX; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/png').split(',')[1]);
            };
        };
    });

    const getImg = (s) => (s && s.length > 200) ? 'data:image/png;base64,' + s : s;

    async function loadData() {
        try {
            const cats = await req('categorias?select=*&order=nombre');
            const prods = await req('productos?select=*&order=nombre');
            const orders = await req('pedidos?select=*&order=id.desc');

            // Pedidos
            const otable = document.getElementById('table-orders'); otable.innerHTML = '';
            const emptyMsg = document.getElementById('no-orders');
            if (!orders || orders.length === 0) emptyMsg.classList.remove('hidden');
            else {
                emptyMsg.classList.add('hidden');
                orders.forEach(o => {
                    const statusColor = o.estado === 'entregado' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-blue-100 text-blue-700 border-blue-200';
                    otable.innerHTML += `<tr class="hover:bg-slate-50 transition"><td class="p-6 font-bold text-slate-400 text-xs">ORDEN #${o.id}</td><td class="p-6 font-black text-primary text-lg tracking-tighter">L. ${parseFloat(o.total).toFixed(2)}</td><td class="p-6 text-center"><span class="px-3 py-1 rounded-full border text-[9px] font-black uppercase ${statusColor}">${o.estado}</span></td><td class="p-6 text-center flex gap-1 justify-center"><button onclick="updOrd('${o.id}', 'pendiente')" class="bg-slate-100 p-2 rounded-lg text-[8px] font-black hover:bg-slate-200 transition">RECIBIDO</button><button onclick="updOrd('${o.id}', 'preparando')" class="bg-blue-50 text-blue-600 p-2 rounded-lg text-[8px] font-black hover:bg-blue-600 hover:text-white transition">PREPARADO</button><button onclick="updOrd('${o.id}', 'en_camino')" class="bg-purple-50 text-purple-600 p-2 rounded-lg text-[8px] font-black hover:bg-purple-600 hover:text-white transition">EN CAMINO</button><button onclick="updOrd('${o.id}', 'entregado')" class="bg-green-600 text-white px-3 py-2 rounded-lg text-[8px] font-black shadow hover:brightness-110 transition">ENTREGADO ✅</button></td></tr>`;
                });
            }

            // Categorías
            const grid = document.getElementById('grid-cats'); const select = document.getElementById('prod-cat');
            grid.innerHTML = ''; select.innerHTML = '<option value="">Categoría...</option>';
            cats.forEach(c => {
                grid.innerHTML += `<div class="bg-white p-5 rounded-[2.5rem] border border-white shadow-sm text-center relative group hover:shadow-2xl transition"><div class="w-24 h-24 bg-slate-50 rounded-2xl mx-auto mb-3 flex items-center justify-center overflow-hidden border-2 border-white"><img src="${getImg(c.imagen_url)}" class="w-16 h-16 object-contain"></div><p class="font-black text-slate-700 text-[10px] uppercase tracking-tighter">${c.nombre}</p><div class="mt-3 opacity-0 group-hover:opacity-100 transition"><button onclick='editCat(${JSON.stringify(c)})' class="text-blue-500 font-bold text-[9px] underline uppercase tracking-widest">Editar</button></div></div>`;
                select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            });

            // Productos
            const ptable = document.getElementById('table-prods'); ptable.innerHTML = '';
            prods.forEach(p => {
                ptable.innerHTML += `<tr class="hover:bg-slate-50 transition"><td class="p-6"><img src="${getImg(p.imagen_url)}" class="h-16 w-16 object-cover rounded-3xl bg-gray-100 border border-white shadow-sm"></td><td class="p-6"><p class="font-black text-slate-800 text-sm uppercase tracking-tighter">${p.nombre}</p><p class="text-[9px] text-slate-400 font-bold uppercase">${cats.find(c => c.id == p.categoria_id)?.nombre || 'Gral'}</p></td><td class="p-6 font-black text-primary text-xl tracking-tighter">L. ${parseFloat(p.precio).toFixed(2)}</td><td class="p-6 text-center"><button onclick='editProd(${JSON.stringify(p)})' class="bg-blue-50 text-blue-600 px-5 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-blue-600 hover:text-white transition">Editar</button><button onclick="del('productos','${p.id}')" class="bg-red-50 text-red-400 px-5 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-red-500 hover:text-white transition ml-2">Borrar</button></td></tr>`;
            });
        } catch (e) { console.error(e); }
    }

    async function createSimulatedOrder() {
        try {
            await req('pedidos', 'POST', { perfil_id: 'c0924d95-1d5e-4cd1-bfb3-e676fe53e7e7', total: 750.50, estado: 'pendiente' });
            loadData();
        } catch(e) { alert("Error al simular. Ejecuta el SQL de la tabla pedidos."); }
    }

    async function updOrd(id, s) { await req(`pedidos?id=eq.${id}`, 'PATCH', { estado: s }); loadData(); }
    async function saveCategory() { const id = document.getElementById('cat-id').value; let payload = { nombre: document.getElementById('cat-name').value }; const f = document.getElementById('cat-file').files[0]; if (f) payload.imagen_url = await compress(f); await req(id ? `categorias?id=eq.${id}` : 'categorias', id ? 'PATCH' : 'POST', payload); closeMod(); loadData(); }
    async function saveProduct() { document.getElementById('p-loader').classList.remove('hidden'); const id = document.getElementById('prod-id').value; let p = { nombre: document.getElementById('prod-name').value, descripcion: document.getElementById('prod-desc').value, categoria_id: document.getElementById('prod-cat').value, precio: parseFloat(document.getElementById('prod-price').value), es_oferta: document.getElementById('prod-is-offer').checked, precio_oferta: parseFloat(document.getElementById('prod-price-offer').value || 0) }; const f = document.getElementById('prod-file').files[0]; if (f) p.imagen_url = await compress(f); await req(id ? `productos?id=eq.${id}` : 'productos', id ? 'PATCH' : 'POST', p); closeMod(); loadData(); }

    function editCat(c) { document.getElementById('cat-id').value = c.id; document.getElementById('cat-name').value = c.nombre; openMod('modal-cat'); }
    function editProd(p) { document.getElementById('prod-id').value = p.id; document.getElementById('prod-name').value = p.nombre; document.getElementById('prod-desc').value = p.descripcion; document.getElementById('prod-cat').value = p.categoria_id; document.getElementById('prod-price').value = p.precio; document.getElementById('prod-is-offer').checked = p.es_oferta; document.getElementById('prod-price-offer').value = p.precio_oferta; openMod('modal-prod'); }
    function openMod(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeMod() { document.querySelectorAll('.fixed').forEach(m => m.classList.add('hidden')); document.getElementById('p-loader').classList.add('hidden'); }
    function switchTab(t) { document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden')); document.getElementById('sec-' + t).classList.remove('hidden'); document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active')); document.getElementById('btn-' + t).classList.add('active'); }
    async function del(t, id) { if (confirm('¿Eliminar?')) { await req(`${t}?id=eq.${id}`, 'DELETE'); loadData(); } }

    window.onload = loadData;
</script>
</body> </html>
